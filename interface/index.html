<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diabetes Prediction System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Diabetes Prediction System</h1>
    <form id="predictionForm">
      <label>Age:</label>
      <input type="number" id="age" required>
      
      <div class="gender-pregnancies-row">
        <div class="gender-field">
          <label>Gender:</label>
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        
        <div class="pregnancies-field" id="pregnanciesContainer" style="display: none;">
          <label>Pregnancies:</label>
          <select id="pregnancies" required>
            <option value="0">No</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5+</option>
          </select>
        </div>
      </div>

      <label>Glucose:</label>
      <input type="number" id="glucose" required>

      <label>Blood Pressure:</label>
      <input type="number" id="bp" required>

      <label>Skin Thickness:</label>
      <input type="number" id="skin" required>

      <label>Insulin:</label>
      <input type="number" id="insulin" required>

      <label>BMI:</label>
      <input type="number" step="0.1" id="bmi" required>

      <label>Diabetes Pedigree Function:</label>
      <input type="number" step="0.01" id="pedigree" required>

      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
